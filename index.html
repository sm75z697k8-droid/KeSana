<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="KeSana — a modern map experience for Malaysia.">
  <title>KeSana — Explore Malaysia</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app-shell" aria-label="KeSana Malaysia map">
    <div id="map" class="map-surface" role="application" aria-label="Interactive map of Malaysia"></div>
    <div class="map-tint" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand" aria-label="KeSana">
        <span class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 17.5L10.5 6.5L13.2 12.1L19 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="19" cy="5" r="2" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-type">my<span>arah</span><small>MAPS, MADE FOR MALAYSIA</small></span>
      </div>
      <div class="region-pill"><span class="region-dot"></span> MY <span class="region-divider"></span> V1.0</div>
    </header>

    <div class="map-actions" aria-label="Map controls">
      <button id="locate-btn" class="map-action" type="button" aria-label="Find my location" title="Find my location">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.75V5.3M12 18.7v2.55M21.25 12H18.7M5.3 12H2.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="6.35" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
        </svg>
      </button>
      <div class="zoom-stack">
        <button id="zoom-in" class="map-action zoom-action" type="button" aria-label="Zoom in" title="Zoom in">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="zoom-divider"></span>
        <button id="zoom-out" class="map-action zoom-action" type="button" aria-label="Zoom out" title="Zoom out">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <section class="search-dock" id="search-dock" aria-label="Find a destination">
      <div class="dock-handle" aria-hidden="true"></div>
      <div class="dock-heading">
        <div>
          <p class="eyebrow"><span class="eyebrow-dot"></span> YOUR NEXT DESTINATION</p>
          <h1>Where to<span class="accent">?</span></h1>
        </div>
        <div class="malaysia-badge" aria-label="Search Malaysia">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-5.2 7-11a7 7 0 0 0-14 0c0 5.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.75"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.75"/></svg>
          Malaysia
        </div>
      </div>

      <form id="search-form" class="search-field" autocomplete="off" role="search">
        <button class="search-icon-button" type="submit" aria-label="Search for destination" title="Search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6" stroke="currentColor" stroke-width="1.9"/><path d="m16 16 4.25 4.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <label class="sr-only" for="search-input">Search places in Malaysia</label>
        <input id="search-input" type="search" name="destination" placeholder="Search places in Malaysia" enterkeyhint="search" inputmode="search" spellcheck="false" aria-describedby="search-help">
        <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" title="Clear search" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <span class="enter-hint" aria-hidden="true">↵</span>
      </form>

      <div id="quick-places" class="quick-places">
        <div class="quick-heading"><span>QUICK EXPLORE</span><span class="quick-line"></span></div>
        <div class="quick-chips">
          <button type="button" class="quick-chip" data-place="kuala-lumpur"><span class="chip-dot"></span> Kuala Lumpur <span aria-hidden="true">↗</span></button>
          <button type="button" class="quick-chip" data-place="george-town"><span class="chip-dot"></span> George Town <span aria-hidden="true">↗</span></button>
          <button type="button" class="quick-chip" data-place="kota-kinabalu"><span class="chip-dot"></span> Kota Kinabalu <span aria-hidden="true">↗</span></button>
        </div>
        <p id="search-help" class="hint">Press search to find a place on the map.</p>
      </div>

      <div id="search-results" class="search-results" hidden>
        <div class="results-heading"><span id="results-label">SEARCH RESULTS</span><span id="results-count"></span></div>
        <div id="results-list" class="results-list" role="list"></div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
